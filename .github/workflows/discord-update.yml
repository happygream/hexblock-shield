name: Discord Update
on:
  push:
    branches: ["**"]
  release:
    types: [published]
  create:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.head_commit != null
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          REPO="${{ github.repository }}"
          REPONAME="${{ github.event.repository.name }}"
          ABOUT=$(echo "${{ github.event.repository.description }}" | head -c 300)
          HOMEPAGE="${{ github.event.repository.homepage }}"
          LANG="${{ github.event.repository.language }}"
          DEFBRANCH="${{ github.event.repository.default_branch }}"
          ACTOR="${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"
          COLOR=1975599

          THUMB="https://raw.githubusercontent.com/$REPO/$DEFBRANCH/.github/logo.png"

          if [ "$EVENT" = "release" ]; then
            TITLE="Release ${{ github.event.release.tag_name }}"
            URL="${{ github.event.release.html_url }}"
            BODY=$(echo "${{ github.event.release.body }}" | head -c 1500)
            EXTRA='[]'
          elif [ "$EVENT" = "create" ] && [ "${{ github.event.ref_type }}" = "tag" ]; then
            TITLE="Tagged ${{ github.event.ref }}"
            URL="https://github.com/$REPO/releases/tag/${{ github.event.ref }}"
            BODY=""
            EXTRA='[]'
          else
            SHA="${{ github.event.head_commit.id }}"; SHORT="${SHA:0:7}"
            TITLE=$(echo "${{ github.event.head_commit.message }}" | head -1 | head -c 200)
            URL="${{ github.event.head_commit.url }}"; BODY=""
            NADD=$(echo '${{ toJSON(github.event.head_commit.added) }}' | jq 'length')
            NMOD=$(echo '${{ toJSON(github.event.head_commit.modified) }}' | jq 'length')
            NREM=$(echo '${{ toJSON(github.event.head_commit.removed) }}' | jq 'length')
            TOTAL=$((NADD+NMOD+NREM))
            if [ "$TOTAL" -gt 0 ]; then
              EXTRA=$(jq -n --arg branch "$BRANCH" --arg commit "[\`$SHORT\`]($URL)" \
                --arg changes "+$NADD ~$NMOD -$NREM" \
                '[{name:"Branch",value:$branch,inline:true},
                  {name:"Commit",value:$commit,inline:true},
                  {name:"Changes",value:$changes,inline:true}]')
            else
              EXTRA=$(jq -n --arg branch "$BRANCH" --arg commit "[\`$SHORT\`]($URL)" \
                '[{name:"Branch",value:$branch,inline:true},
                  {name:"Commit",value:$commit,inline:true}]')
            fi
          fi

          DESC="$ABOUT"
          [ -n "$BODY" ] && DESC="$ABOUT

          $BODY"

          META=""
          [ -n "$LANG" ] && META="$LANG"
          [ -n "$HOMEPAGE" ] && META="$META  •  [site]($HOMEPAGE)"

          jq -n \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg desc "$DESC" \
            --arg repo "$REPO" \
            --arg reponame "$REPONAME" \
            --arg meta "$META" \
            --arg thumb "$THUMB" \
            --argjson color "$COLOR" \
            --argjson extra "$EXTRA" \
            '{
              embeds: [ {
                author: {name: $reponame, url: ("https://github.com/" + $repo)},
                title: $title,
                url: $url,
                description: (if $desc == "" then null else $desc end),
                color: $color,
                fields: $extra,
                thumbnail: {url: $thumb},
                footer: {text: ($repo + (if $meta != "" then "  •  " + $meta else "" end))},
                timestamp: (now | todateiso8601)
              } ]
            }' \
          | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"
